name: Deploy to Modal

on:
  push:
    branches: [main]
    paths: ["voice_api.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: Deploy
        run: modal deploy voice_api.py
      - name: Health check
        run: |
          URL=$(python -c "import modal;print(modal.Function.from_name('canwe-voice','web').get_web_url())")
          echo "API URL: $URL"
          echo "### API URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 120 "$URL/health" && exit 0
            sleep 20
          done
          exit 1
      - name: Register Telegram webhook (token stays inside Modal)
        run: modal run voice_api.py::setup_webhook
